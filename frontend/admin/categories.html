<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Categories — QuizApp</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-mount" class="navbar"></div>

  <div class="container">
    <div class="flex-between mb-16">
      <h1 style="margin:0;">Manage Categories</h1>
      <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
    </div>
    <a href="dashboard.html" class="text-muted" style="font-size:.85rem;">← Back to Admin Dashboard</a>

    <div class="grid grid-3 mt-16" id="categories-admin-grid">
      <p class="text-muted">Loading...</p>
    </div>
  </div>

  <div class="modal-overlay" id="category-modal">
    <div class="modal-box">
      <h3 id="category-modal-title">Add Category</h3>
      <div class="form-error-box" id="category-form-error"></div>
      <form id="category-form">
        <input type="hidden" id="c-id">
        <div class="form-group">
          <label for="c-name">Name</label>
          <input type="text" id="c-name" required>
        </div>
        <div class="form-group">
          <label for="c-description">Description</label>
          <textarea id="c-description" rows="2"></textarea>
        </div>
        <div class="flex gap-12">
          <button type="button" class="btn btn-outline btn-block" onclick="closeCategoryModal()">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block" id="category-submit-btn">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
