<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Questions — QuizApp</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-mount" class="navbar"></div>

  <div class="container">
    <div class="flex-between mb-16" style="flex-wrap:wrap;gap:10px;">
      <h1 style="margin:0;">Manage Questions</h1>
      <button class="btn btn-primary" onclick="openQuestionModal()">+ Add Question</button>
    </div>
    <a href="dashboard.html" class="text-muted" style="font-size:.85rem;">← Back to Admin Dashboard</a>

    <div class="flex gap-12 mt-16 mb-16" style="flex-wrap:wrap;">
      <input type="text" id="search-input" placeholder="Search questions..." style="max-width:240px;">
      <select id="filter-category"><option value="">All Categories</option></select>
      <select id="filter-difficulty">
        <option value="">All Difficulties</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      <table id="questions-table">
        <thead><tr><th>Question</th><th>Category</th><th>Difficulty</th><th>Correct</th><th></th></tr></thead>
        <tbody><tr><td colspan="5" class="text-muted" style="padding:20px;">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Question Modal -->
  <div class="modal-overlay" id="question-modal">
    <div class="modal-box" style="max-width:600px;">
      <h3 id="question-modal-title">Add Question</h3>
      <div class="form-error-box" id="question-form-error"></div>
      <form id="question-form">
        <input type="hidden" id="q-id">
        <div class="form-group">
          <label for="q-category">Category</label>
          <select id="q-category" required></select>
        </div>
        <div class="form-group">
          <label for="q-text">Question</label>
          <textarea id="q-text" rows="2" required></textarea>
        </div>
        <div class="grid grid-2">
          <div class="form-group"><label>Option A</label><input type="text" id="q-a" required></div>
          <div class="form-group"><label>Option B</label><input type="text" id="q-b" required></div>
          <div class="form-group"><label>Option C</label><input type="text" id="q-c" required></div>
          <div class="form-group"><label>Option D</label><input type="text" id="q-d" required></div>
        </div>
        <div class="grid grid-2">
          <div class="form-group">
            <label for="q-correct">Correct Answer</label>
            <select id="q-correct" required>
              <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
            </select>
          </div>
          <div class="form-group">
            <label for="q-difficulty">Difficulty</label>
            <select id="q-difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="q-explanation">Explanation (optional)</label>
          <textarea id="q-explanation" rows="2"></textarea>
        </div>
        <div class="flex gap-12">
          <button type="button" class="btn btn-outline btn-block" onclick="closeQuestionModal()">Cancel</button>
          <button type="submit" class="btn btn-primary btn-block" id="question-submit-btn">Save Question</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
