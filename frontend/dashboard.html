<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — QuizApp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar-mount" class="navbar"></div>

  <div class="container">
    <h1 id="welcome-msg">Welcome!</h1>
    <p class="text-muted mb-24">Pick a category below and start a quiz.</p>

    <div class="grid grid-3 mb-24">
      <div class="card stat-card">
        <div class="stat-value" id="stat-total">–</div>
        <div class="stat-label">Quizzes Completed</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value" id="stat-avg">–</div>
        <div class="stat-label">Average Score</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value" id="stat-best">–</div>
        <div class="stat-label">Best Score</div>
      </div>
    </div>

    <h2 class="mb-16">Categories</h2>
    <div class="grid grid-3" id="categories-grid">
      <p class="text-muted">Loading categories...</p>
    </div>

    <h2 class="mt-24 mb-16">Recent Quiz History</h2>
    <div class="card" id="history-card">
      <p class="text-muted">Loading history...</p>
    </div>
  </div>

  <!-- Start Quiz Modal -->
  <div class="modal-overlay" id="start-modal">
    <div class="modal-box">
      <h3 id="modal-category-name">Start Quiz</h3>
      <div class="form-group">
        <label for="modal-difficulty">Difficulty</label>
        <select id="modal-difficulty">
          <option value="mixed">Mixed</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="form-group">
        <label for="modal-num-questions">Number of Questions</label>
        <select id="modal-num-questions">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="flex gap-12">
        <button class="btn btn-outline btn-block" onclick="closeStartModal()">Cancel</button>
        <button class="btn btn-primary btn-block" onclick="beginQuiz()">Start</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
